<svg xmlns="http://www.w3.org/2000/svg" width="560" height="760" viewBox="0 0 560 760" role="img" aria-labelledby="title desc">
<title id="title">Two-wire CAN bus with SystemCore and two Cyclones</title>
<desc id="desc">Yellow CAN H and green CAN L run along a chain with a 120-ohm terminator across the pair at each end. Each Cyclone joins through its supplied male and female two-pin Molex connectors. Power wires are not shown.</desc>
<rect width="560" height="760" rx="12" fill="#15191d"/>
<g font-family="Arial, sans-serif" fill="#f4f6f8"><text x="28" y="38" font-size="24" font-weight="bold">CAN bus: two wires, two ends</text>
<text x="40" y="80" font-size="19" fill="#ffe063">H = yellow</text><text x="292" y="80" font-size="19" fill="#6bd699">L = green</text></g>
<path d="M230 112V680" stroke="#f1cc39" stroke-width="7"/><path d="M274 112V680" stroke="#3bae70" stroke-width="7"/>
<g stroke="#e3e8ed" fill="#222a31" stroke-width="2"><rect x="220" y="104" width="64" height="20" rx="3"/><rect x="220" y="674" width="64" height="20" rx="3"/></g>
<g font-family="Arial, sans-serif" font-size="18" fill="#f4f6f8"><text x="307" y="120">120 Ω at this end</text><text x="307" y="691">120 Ω at this end</text></g>
<g stroke="#576571" stroke-width="2" fill="#222a31"><rect x="50" y="172" width="158" height="70" rx="8"/><rect x="50" y="327" width="158" height="86" rx="8"/><rect x="50" y="512" width="158" height="86" rx="8"/></g>
<path d="M208 195H230 M208 350H230 M208 535H230" stroke="#f1cc39" stroke-width="5"/><path d="M208 218H274 M208 388H274 M208 573H274" stroke="#3bae70" stroke-width="5"/>
<g font-family="Arial, sans-serif" fill="#f4f6f8" font-size="21" text-anchor="middle"><text x="129" y="214">SystemCore</text><text x="129" y="376">Cyclone 1</text><text x="129" y="561">Cyclone 2</text></g>
<g stroke="#c6d0d8" fill="#303b44" stroke-width="2"><rect x="216" y="294" width="72" height="20" rx="4"/><rect x="216" y="430" width="72" height="20" rx="4"/><rect x="216" y="479" width="72" height="20" rx="4"/><rect x="216" y="615" width="72" height="20" rx="4"/></g>
<g font-family="Arial, sans-serif" fill="#c6d0d8" font-size="18"><text x="309" y="309">2-pin Molex</text><text x="309" y="445">2-pin Molex</text><text x="309" y="494">2-pin Molex</text><text x="309" y="630">2-pin Molex</text><text x="309" y="355">Each Cyclone:</text><text x="309" y="380">one male,</text><text x="309" y="405">one female</text><text x="28" y="737">Connection diagram · power wires not shown</text></g>
</svg>